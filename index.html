<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishva - New Farming</title>
  <meta name="description" content="Krishva uses deep learning to identify crop diseases from a leaf photo and gives the remedy in English and Hindi.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --kr-green: #198754; --kr-leaf: #F7FFE0; }
    body { background: var(--kr-leaf); }
    .preview { max-width: 100%; max-height: 300px; display: none; margin-bottom: 16px; }

    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 14px; flex: 0 0 auto;
      background: linear-gradient(135deg, #198754, #0dcaf0);
      color: #fff; font-weight: 800; font-size: 1.3rem;
    }
    .tagline { color: #557a2f; font-size: .9rem; }

    /* --- toggles --- */
    .seg { display: inline-flex; border: 1px solid #ced4da; border-radius: 8px; overflow: hidden; }
    .seg button {
      border: 0; padding: .3rem .85rem; font-size: .85rem; font-weight: 600;
      background: #fff; color: #495057; transition: background .15s, color .15s;
    }
    .seg button + button { border-left: 1px solid #ced4da; }
    .seg button.active { background: var(--kr-green); color: #fff; }
    .seg button:not(.active):hover { background: #eef7ee; }
    .setting-card { background: #fff; border: 1px solid #e3e8dc; border-radius: 10px; }

    /* --- results table --- */
    #resultCard { display: none; }
    .table thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .4px; }
    .table tbody td { font-size: .93rem; vertical-align: middle; }
    tr.top-result { background: #eaf7ec; }
    tr.top-result td { font-weight: 600; }
    .rank-pill {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      font-size: .78rem; font-weight: 700; color: #fff; background: #adb5bd;
    }
    .rank-pill.r1 { background: #198754; }
    .rank-pill.r2 { background: #ffc107; color: #212529; }
    .rank-pill.r3 { background: #6c757d; }

    .bar-cell { min-width: 130px; }
    .conf-bar {
      position: relative; height: 20px; border-radius: 4px;
      background: #e9ecef; overflow: hidden;
    }
    .conf-bar > span { display: block; height: 100%; background: #198754; }
    .conf-bar.mid > span { background: #ffc107; }
    .conf-bar.low > span { background: #dc3545; }
    .conf-num { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }

    .remedy-card { border-left: 5px solid var(--kr-green); }
    .speaking { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(13, 202, 240, .28); } }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 700px;">

    <!-- header -->
    <div class="d-flex align-items-center gap-3 mb-1">
      <div class="brand-mark">Kr</div>
      <div>
        <h2 class="mb-0 text-success fw-bold">Krishva</h2>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>

    <!-- settings -->
    <div class="setting-card p-3 my-3">
      <div class="row g-3 align-items-center">
        <div class="col-sm-6 d-flex align-items-center justify-content-between gap-2">
          <span class="small fw-semibold text-secondary" id="langLabel"></span>
          <div class="seg" id="langToggle" role="group">
            <button type="button" data-lang="en" class="active">English</button>
            <button type="button" data-lang="hi">हिन्दी</button>
          </div>
        </div>
        <div class="col-sm-6 d-flex align-items-center justify-content-between gap-2">
          <span class="small fw-semibold text-secondary" id="voiceLabel"></span>
          <div class="seg" id="voiceToggle" role="group">
            <button type="button" data-voice="off" class="active" id="voiceOffBtn">Off</button>
            <button type="button" data-voice="on" id="voiceOnBtn">On</button>
          </div>
        </div>
      </div>
      <div class="small text-muted mt-2" id="voiceNote"></div>
    </div>

    <p class="text-muted" id="intro"></p>

    <!-- upload -->
    <form id="uploadForm">
      <input type="file" class="form-control mb-2" id="imageInput" accept="image/*" required>
      <img id="preview" class="preview rounded border" src="#" alt="preview">
      <button type="submit" class="btn btn-success w-100 fw-bold mb-3" id="analyzeBtn"></button>
    </form>

    <div id="loading" style="display:none">
      <div class="alert alert-info" id="loadingText"></div>
    </div>
    <div id="errorBox"></div>

    <!-- results: table of top 3, then remedy for the top one only -->
    <div id="resultCard" class="mt-4">
      <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
        <h5 class="fw-bold mb-0" id="resultsHeading"></h5>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="newScanBtn">
          &#8634; Diagnose another leaf
        </button>
      </div>
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-sm mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th scope="col" style="width:52px" id="thRank"></th>
                <th scope="col" id="thDisease"></th>
                <th scope="col" style="width:190px" id="thConfidence"></th>
              </tr>
            </thead>
            <tbody id="resultRows"></tbody>
          </table>
        </div>
      </div>

      <div id="remedyCard" class="alert alert-light border remedy-card mt-3">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
          <div class="small fw-bold text-uppercase text-secondary" id="topDiseaseLabel"></div>
          <button type="button" class="btn btn-sm btn-outline-success" id="replayBtn"></button>
        </div>
        <div id="remedyText" style="font-size:.95rem"></div>
      </div>

      <div id="lowConfWarn"></div>
    </div>

    <hr class="my-4">
    <p class="text-muted small mb-0" id="footer"></p>

  </div>

  <script>
    // ------------------------------------------------------------------
    // Where the FastAPI backend lives.
    //
    // Hardcoding http://localhost:8000 is what broke the deployed site: on
    // someone else's computer "localhost" means *their* machine, and a
    // page served over HTTPS is not allowed to call an http:// URL at all
    // (mixed content), so the browser silently refused every request.
    //
    // If you host the API somewhere public, set it here. Leave it as "" to
    // auto-detect.
    // ------------------------------------------------------------------
    const CONFIG = {
      backendUrl: ''   // e.g. 'https://krishva-api.onrender.com'
    };

    function resolveApiBase() {
      if (CONFIG.backendUrl) return CONFIG.backendUrl.replace(/\/+$/, '');
      const loc = window.location;
      const isLocal = loc.protocol === 'file:'
        || /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/i.test(loc.hostname);
      // Local: run the backend yourself. Public: same origin as the page.
      return isLocal ? 'http://localhost:8000' : loc.origin;
    }

    const API_URL = resolveApiBase();
    let apiReachable = null;   // null = not tested yet

    // ---------- state ----------
    let lang = 'en';
    let voice = 'off';
    let lastResults = null;
    let uiText = null;
    let audioEl = null;          // server-generated MP3 player

    const FALLBACK_UI = {
      en: { tagline:'Krish (farming) + Nova (new) = New Farming',
            intro:'Upload a photo of a single leaf.', analyze:'Analyze Leaf',
            analyzing:'Analyzing the leaf, please wait...', results:'Results',
            confidence:'Confidence', remedy:'Remedy', language:'Language',
            voice:'Voice output', voice_on:'On', voice_off:'Off',
            rank:'Rank', disease:'Predicted disease', remedy_for:'Remedy for',
            replay:'Speak again', predicting:'Generating audio, please wait...',
            low_confidence:'Confidence is low. Try a clearer photo.',
            no_remedy:'No remedy info available.', footer:'',
            new_scan:'Diagnose another leaf',
            generating_voice:'Generating audio...',
            no_voice_and_no_server:'Your browser has no voice for this language and the server is unreachable, so audio cannot play.',
            voice_failed:'Could not generate audio. Check the backend and internet.',
            server_voice_note:'Your browser has no Hindi voice, so audio is generated by the server. This needs an internet connection.' },
      hi: { tagline:'कृषि (खेती) + नव (नया) = नई खेती',
            intro:'एक पत्ती की फोटो अपलोड करें।', analyze:'विश्लेषण करें',
            analyzing:'विश्लेषण हो रहा है...', results:'परिणाम',
            confidence:'विश्वास स्तर', remedy:'उपाय', language:'भाषा',
            voice:'आवाज़', voice_on:'चालू', voice_off:'बंद',
            rank:'स्थान', disease:'पहचानी गई बीमारी', remedy_for:'उपाय',
            replay:'फिर से सुनाएं', predicting:'आवाज़ तैयार हो रही है...',
            low_confidence:'विश्वास स्तर कम है। साफ़ फोटो के साथ फिर कोशिश करें।',
            no_remedy:'कोई उपाय जानकारी उपलब्ध नहीं है।', footer:'',
            new_scan:'एक और पत्ती की जाँच करें',
            generating_voice:'आवाज़ बन रही है...',
            no_voice_and_no_server:'इस भाषा के लिए ब्राउज़र में आवाज़ नहीं है और सर्वर भी उपलब्ध नहीं है।',
            voice_failed:'आवाज़ नहीं बन सकी। बैकएंड और इंटरनेट जाँचें।',
            server_voice_note:'आपके ब्राउज़र में हिन्दी आवाज़ नहीं है, इसलिए आवाज़ सर्वर बनाएगा। इसके लिए इंटरनेट चाहिए।' }
    };

    const t = (key) => {
      const src = (uiText && uiText[lang]) || FALLBACK_UI[lang];
      return src[key] !== undefined ? src[key] : (FALLBACK_UI.en[key] || '');
    };

    const topResult = () => lastResults && lastResults[0];
    const localised = (r) => lang === 'hi'
      ? { name: r.name_hi, remedy: r.remedy_hi }
      : { name: r.name_en, remedy: r.remedy_en };

    // ---------- voice: browser first, server gTTS as the reliable fallback ----------
    const synth = window.speechSynthesis;
    const speechSupported = !!synth;
    let browserVoice = null;

    // Chrome populates the voice list asynchronously, so poll rather than
    // trusting a single synchronous read.
    function detectVoice(wantLang) {
      if (!speechSupported) return null;
      const voices = synth.getVoices() || [];
      const tag = wantLang === 'hi' ? 'hi' : 'en';
      return voices.find(v => (v.lang || '').toLowerCase() === tag + '-in')
          || voices.find(v => (v.lang || '').toLowerCase().startsWith(tag))
          || null;
    }

    function refreshVoice() {
      browserVoice = detectVoice(lang);
    }

    function stopSpeaking() {
      if (speechSupported) synth.cancel();
      if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
      document.getElementById('remedyCard').classList.remove('speaking');
    }

    // Speak via the server (gTTS). This is what makes Hindi work even where
    // the browser refuses to expose the hi-IN voice.
    function speakViaServer(text) {
      const card = document.getElementById('remedyCard');
      card.classList.add('speaking');
      note(t('generating_voice'));
      fetch(API_URL + '/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, lang: lang })
      })
        .then(function (res) {
          if (!res.ok) throw new Error('speak failed ' + res.status);
          return res.blob();
        })
        .then(function (blob) {
          if (audioEl) { audioEl.pause(); URL.revokeObjectURL(audioEl.src); }
          audioEl = new Audio(URL.createObjectURL(blob));
          audioEl.onended = function () { card.classList.remove('speaking'); };
          audioEl.onerror = function () { card.classList.remove('speaking'); };
          return audioEl.play();
        })
        .then(function () { note(''); })
        .catch(function () {
          card.classList.remove('speaking');
          note(t('voice_failed'));
        });
    }

    function speak(text) {
      if (!text) return;
      refreshVoice();
      if (browserVoice) {
        try {
          synth.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
          u.voice = browserVoice;
          u.rate = 0.95;
          synth.speak(u);
          document.getElementById('remedyCard').classList.add('speaking');
          return;
        } catch (e) { /* fall through to the server */ }
      }
      speakViaServer(text);
    }

    function note(msg) {
      document.getElementById('voiceNote').textContent = msg || '';
    }

    // A clear, actionable message beats a silent failure. The most common
    // cause is the hardcoded localhost being unreachable from a real website.
    function showApiError() {
      const box = document.getElementById('errorBox');
      const local = /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(window.location.hostname)
        || window.location.protocol === 'file:';
      box.className = 'alert alert-danger';
      box.textContent = lang === 'hi'
        ? 'सर्वर से संपर्क नहीं हो पाया। (' + API_URL + ')'
        : 'Could not reach the Krishva server at ' + API_URL
          + (local
              ? '. Start it with: uvicorn main:app --port 8000'
              : '. The site needs a public backend URL configured in CONFIG.backendUrl.');
    }

    // Check the backend once at startup and say so immediately if it is down.
    function probeApi() {
      return fetch(API_URL + '/')
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
        .then(function (d) {
          apiReachable = true;
          if (d.ui) { uiText = d.ui; renderStatic(); }
          return true;
        })
        .catch(function () {
          apiReachable = false;
          const box = document.getElementById('errorBox');
          if (!lastResults) {
            box.className = 'alert alert-warning';
            box.textContent = lang === 'hi'
              ? 'सर्वर से संपर्क नहीं हो पाया। (' + API_URL + ')'
              : 'Krishva cannot reach its server at ' + API_URL
                + (/(localhost|127\.0\.0\.1|file:)/i.test(window.location.href)
                    ? '. Start it with: uvicorn main:app --port 8000'
                    : '. A public backend URL must be set in CONFIG.backendUrl.');
          }
          return false;
        });
    }

    // ---------- rendering ----------
    function renderStatic() {
      document.documentElement.lang = lang;
      ['tagline','langLabel','voiceLabel','intro','analyzeBtn','loadingText',
       'resultsHeading','footer','thRank','thDisease','thConfidence',
       'topDiseaseLabel','replayBtn','voiceOffBtn','voiceOnBtn',
       'newScanBtn'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        const map = {
          tagline:'tagline', langLabel:'language', voiceLabel:'voice',
          intro:'intro', analyzeBtn:'analyze', loadingText:'analyzing',
          resultsHeading:'results', footer:'footer', thRank:'rank',
          thDisease:'disease', thConfidence:'confidence', replayBtn:'replay',
          voiceOffBtn:'voice_off', voiceOnBtn:'voice_on', newScanBtn:'new_scan'
        };
        if (map[id]) el.textContent = t(map[id]);
      });

      // When voice is on, only warn if the browser cannot speak this
      // language, because then the server has to generate the audio.
      const noteEl = document.getElementById('voiceNote');
      if (voice !== 'on') {
        noteEl.textContent = '';
      } else if (!speechSupported) {
        noteEl.textContent = t('server_voice_note');
      } else if (detectVoice(lang)) {
        noteEl.textContent = '';
      } else if (apiReachable === false) {
        noteEl.textContent = t('no_voice_and_no_server');
      } else {
        noteEl.textContent = t('server_voice_note');
      }

      document.querySelectorAll('#langToggle button').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === lang));
      document.querySelectorAll('#voiceToggle button').forEach(b =>
        b.classList.toggle('active', b.dataset.voice === voice));
    }

    function renderResults() {
      const rows = document.getElementById('resultRows');
      rows.textContent = '';
      if (!lastResults) { document.getElementById('resultCard').style.display = 'none'; return; }

      lastResults.forEach(function (r, i) {
        const L = localised(r);
        const tr = document.createElement('tr');
        if (i === 0) tr.className = 'top-result';

        // rank
        const tdRank = document.createElement('td');
        const pill = document.createElement('span');
        pill.className = 'rank-pill r' + (i + 1);
        pill.textContent = String(i + 1);
        tdRank.appendChild(pill);

        // disease name
        const tdName = document.createElement('td');
        tdName.textContent = L.name;

        // confidence with bar
        const tdConf = document.createElement('td');
        tdConf.className = 'bar-cell';

        const wrap = document.createElement('div');
        wrap.className = 'd-flex align-items-center gap-2';

        const bar = document.createElement('div');
        bar.className = 'conf-bar flex-grow-1' +
          (r.confidence >= 40 ? (r.confidence >= 70 ? '' : ' mid') : ' low');
        const fill = document.createElement('span');
        fill.style.width = Math.max(0, Math.min(100, r.confidence)) + '%';
        bar.appendChild(fill);

        const num = document.createElement('span');
        num.className = 'conf-num';
        num.textContent = r.confidence + '%';

        wrap.appendChild(bar);
        wrap.appendChild(num);
        tdConf.appendChild(wrap);

        tr.appendChild(tdRank);
        tr.appendChild(tdName);
        tr.appendChild(tdConf);
        rows.appendChild(tr);
      });

      // remedy for the TOP result only
      const top = topResult();
      const L = localised(top);
      document.getElementById('topDiseaseLabel').textContent =
        t('remedy_for') + ' ' + L.name;
      document.getElementById('remedyText').textContent = L.remedy;

      const warn = document.getElementById('lowConfWarn');
      warn.textContent = '';
      if (top.confidence < 60) {
        const d = document.createElement('div');
        d.className = 'alert alert-warning mt-3 mb-0';
        d.textContent = t('low_confidence');
        warn.appendChild(d);
      }

      document.getElementById('resultCard').style.display = 'block';
    }

    // ---------- reset for a new diagnosis ----------
    function resetForNewScan() {
      stopSpeaking();
      lastResults = null;
      document.getElementById('imageInput').value = '';
      const p = document.getElementById('preview');
      p.removeAttribute('src');
      p.style.display = 'none';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('errorBox').textContent = '';
      renderStatic();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const input = document.getElementById('imageInput');
      if (input) input.focus();
    }

    document.getElementById('newScanBtn')
      .addEventListener('click', resetForNewScan);

    // ---------- toggles ----------
    document.getElementById('langToggle').addEventListener('click', function (e) {
      const btn = e.target.closest('button');
      if (!btn || btn.dataset.lang === lang) return;
      const changed = btn.dataset.lang !== lang;
      lang = btn.dataset.lang;
      renderStatic();
      renderResults();               // instant, no re-upload
      if (changed) { refreshVoice(); stopSpeaking(); }
      if (voice === 'on' && topResult()) {
        const L = localised(topResult());
        speak(L.name + '. ' + L.remedy);
      }
    });

    document.getElementById('voiceToggle').addEventListener('click', function (e) {
      const btn = e.target.closest('button');
      if (!btn || btn.dataset.voice === voice) return;
      voice = btn.dataset.voice;
      renderStatic();
      if (voice === 'on' && topResult()) {
        refreshVoice();
        const L = localised(topResult());
        speak(L.name + '. ' + L.remedy);
      } else {
        stopSpeaking();
      }
    });

    document.getElementById('replayBtn').addEventListener('click', function () {
      if (!topResult()) return;
      refreshVoice();
      const L = localised(topResult());
      speak(L.name + '. ' + L.remedy);
    });

    // ---------- image preview ----------
    document.getElementById('imageInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const p = document.getElementById('preview');
        p.src = evt.target.result;
        p.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // ---------- predict ----------
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const file = document.getElementById('imageInput').files[0];
      if (!file) return;

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('errorBox').textContent = '';
      document.getElementById('resultCard').style.display = 'none';
      note('');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(API_URL + '/api/predict', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          const box = document.getElementById('errorBox');
          box.textContent = data.detail || 'Server error';
          box.className = 'alert alert-danger';
          return;
        }
        if (!data.results || !data.results.length) return;

        uiText = data.ui || uiText;
        lastResults = data.results;
        renderStatic();
        renderResults();
        refreshVoice();

        if (voice === 'on') {
          const L = localised(topResult());
          speak(L.name + '. ' + L.remedy);
        }
      } catch (err) {
        apiReachable = false;
        showApiError();
      } finally {
        btn.disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    });

    // ---------- boot ----------
    renderStatic();
    refreshVoice();
    probeApi();

    if (speechSupported) {
      synth.onvoiceschanged = function () { refreshVoice(); renderStatic(); };
      // Chrome fills the list in over the first second or so.
      [200, 600, 1200, 2000].forEach(function (ms) {
        setTimeout(function () { refreshVoice(); renderStatic(); }, ms);
      });
    }
  </script>
</body>
</html>
